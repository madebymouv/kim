[package]
name = "xtask"
version = "0.0.0"
description = "Repository automation (docs consistency, CI shortcuts, gated e2e runner). Never shipped."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
getrandom = "0.4.3"
kim = { version = "0.0.4", path = "../crates/kim" }
# ADR 0099: `cargo xtask ui-audit` checks geometry reports against the design contract and
# compares screenshots (PNG) with the curated baselines.
kim-design = { version = "0.0.3", path = "../crates/kim-design" }
png = { version = "0.18.1", default-features = false }
regex = "1.13.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
# Step 40: `cargo xtask package` writes deterministic release zips (the version Kim reads).
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
