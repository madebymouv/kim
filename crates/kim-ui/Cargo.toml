[package]
name = "kim-ui"
version = "0.0.3"
description = "The Kim design system's egui components (theme, switch, buttons, settings rows, dialogs, navigation, keycaps) for Kim Manager, the Ddalgak rule editor and Noeul's settings window"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = "1.0.154"
kim-design = { version = "0.0.3", path = "../kim-design" }
kim-hotkeys = { version = "0.0.1", path = "../kim-hotkeys" }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
# ADR 0099: the UI audit's screenshots (only written while KIM_UI_SNAPSHOT is set); the same
# encoder Subak and Noeul already use.
png = { version = "0.18.1", default-features = false }

[dev-dependencies]
egui_kittest = "=0.37.0"
