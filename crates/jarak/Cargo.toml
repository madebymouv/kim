[package]
name = "jarak"
version = "0.0.2"
description = "Jarak (자락): the headless CLI of Kim's native text editor; never opens a window except `jarak open` (ADR 0102)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# ADR 0102: `jarak.exe` links no GUI toolkit (`cargo xtask deps-check` keeps it on the headless
# list); the window is the separate `jarak-gui` package.
[[bin]]
name = "jarak"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
jarak-core = { version = "0.0.2", path = "../jarak-core" }
serde_json = "1.0.154"

[build-dependencies]
kim-winres = { version = "0.0.1", path = "../kim-winres" }
