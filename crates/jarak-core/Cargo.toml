[package]
name = "jarak-core"
version = "0.0.12"
description = "Jarak's document model and editing engine: no GUI toolkit, no windowing, no clipboard (ADR 0102)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# ADR 0102: the core is shared by the headless CLI (`jarak.exe`) and the window (`jarak-gui.exe`)
# and stays on the headless list of `cargo xtask deps-check`: it never links a GUI toolkit.
[lints]
workspace = true

[dependencies]
# The rope (MIT): logarithmic edits and line lookups. Only LF, CR and CRLF break lines, like
# Notepad++ (no `unicode_lines`: U+2028, U+0085 and form feed are ordinary characters).
ropey = { version = "1.6.1", default-features = false, features = ["simd", "cr_lines"] }
# Grapheme clusters for caret movement and deletion (already in the workspace).
unicode-segmentation = "1.13.3"
# East Asian wide characters count two display columns.
unicode-width = "0.2.2"
# Legacy code pages (Windows ANSI, EUC-KR/CP949, Shift_JIS, GBK, Big5, windows-125x, …), Step 87.
encoding_rs = "0.8.35"
# GitHub-flavoured Markdown (MIT), Step 89: tables, task lists, strikethrough, footnotes. No HTML
# output, no SIMD feature needed; the render model is Jarak's own (`markdown`).
pulldown-cmark = { version = "0.13", default-features = false }
# Step 92: Vim's `/` search and `:s` (patterns translated from Vim's syntax). Already in the
# workspace (Ddalgak ships it); the same features: Unicode classes and case folding, no others.
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
# Step 93: the session file (JSON with a schema; the versions already in the workspace).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
# GetACP (the system ANSI code page) and ReplaceFileW (atomic save keeping the attributes).
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_Storage_FileSystem"] }
